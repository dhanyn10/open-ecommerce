services:

  web:
    container_name: oe-web
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
     - 8000:8000
    environment:
      APP_NAME: 'Open Ecommerce'
      APP_KEY: base64:dUU/tjDaLvZv2ChevcXI87IBIoIK9DA4o/UGt5aAa3E=
    networks:
      - shared_network

  db:
    image: mariadb:10.11-jammy
    container_name: oe-db
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MARIADB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      MARIADB_ROOT_PASSWORD: password
      MARIADB_DATABASE: open_ecommerce
    networks:
      - shared_network
  
  adminer:
    container_name: oe-adminer
    image: adminer
    restart: always
    ports:
      - 8080:8080
    networks:
      - shared_network


networks:
  shared_network:
    external: true